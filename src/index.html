<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Swim Tracker</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Swim Tracker</h1>
    <p>Track your swimming. See your progress.</p>
  </header>

  <main>

    <section id="dashboard">
      <h2>Dashboard</h2>

      <div id="swimmerInfo">
        <h3>Welcome, swimmer 👋</h3>
      </div>

      <div id="recentResults">
        <h3>Recent Results</h3>
        <div id="resultsList"></div>
      </div>

      <div id="personalBests">
        <h3>Personal Bests</h3>
        <div id="pbList"></div>
      </div>
    </section>

    <section id="addResult">
      <h2>Add Result</h2>

      <form id="resultForm">

        <label for="date">Date</label>
        <input type="date" id="date" required>

        <label for="stroke">Stroke</label>
        <select id="stroke" required>
          <option value="">Select stroke</option>
          <option value="Freestyle">Freestyle</option>
          <option value="Backstroke">Backstroke</option>
          <option value="Breaststroke">Breaststroke</option>
          <option value="Butterfly">Butterfly</option>
          <option value="IM">Individual Medley</option>
        </select>

        <label for="distance">Distance</label>
        <select id="distance" required>
          <option value="">Select distance</option>
          <option value="25m">25m</option>
          <option value="50m">50m</option>
          <option value="100m">100m</option>
          <option value="200m">200m</option>
          <option value="400m">400m</option>
          <option value="800m">800m</option>
          <option value="1500m">1500m</option>
        </select>

        <label for="time">Time</label>
        <input
          type="text"
          id="time"
          placeholder="e.g. 1:08.73"
          required
        >

        <label for="sessionType">Session</label>
        <select id="sessionType" required>
          <option value="Training">Training</option>
          <option value="Competition">Competition</option>
        </select>

        <button type="submit">Save Result</button>

      </form>
    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
